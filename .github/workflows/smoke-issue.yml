name: Smoke issue

# 仅用于验证下游消费者（如 dsh-superagent）能否收到"非本人提交"的 issue。
# 用 GITHUB_TOKEN 创建，作者为 github-actions[bot]，与仓库所有者的个人账号不同名。
# 验证完成后可以直接删除本文件。

on:
  workflow_dispatch:
    inputs:
      title:
        description: Issue 标题
        required: true
        default: "stats 的平均滞留天数按整日取整，小时级延迟被吞成 0"
      body:
        description: Issue 正文（留空则用内置默认正文）
        required: false
        default: ""

permissions:
  issues: write
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    env:
      ISSUE_TITLE: ${{ inputs.title }}
      ISSUE_BODY: ${{ inputs.body }}
    steps:
      - name: 创建 issue
        uses: actions/github-script@v7
        with:
          script: |
            const fallback = [
              '## 现象',
              '',
              '`buglens stats` 的「平均滞留」只按整天计算，几条放置了十几小时的缺陷显示为 0.0 天。',
              '',
              '## 复现',
              '',
              '```bash',
              'python -m buglens demo',
              'python -m buglens stats',
              '```',
              '',
              '## 期望',
              '',
              '按小时换算后再保留一位小数，而不是先归整到天。',
            ].join('\n')

            const title = process.env.ISSUE_TITLE || '未命名问题'
            const body = (process.env.ISSUE_BODY || '').trim() || fallback

            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            })
            core.notice(`created ${data.html_url}`)
