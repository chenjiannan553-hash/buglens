name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先确认：这个功能会不会让 buglens 需要联网、需要装依赖、需要部署服务？
        如果会，请先说明为什么值得放弃"零依赖 + 单文件"这个前提。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 描述场景，不要直接说方案
      placeholder: 每次发版我都要手动去查哪些 S2 还没指派……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 包括"不改代码也能凑合"的办法

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 这个功能不需要引入第三方依赖
        - label: 这个功能不需要联网
        - label: 如果必须破坏上述约束，我已在上面说明了理由
